[package]
name = "crimson"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = "0.11"
md5 = "0.7"
tokio = { version = "1", features = ["full"] }
winapi = { version = "0.3", features = ["winnt", "libloaderapi", "errhandlingapi", "processthreadsapi", "memoryapi", "handleapi", "minwinbase", "winbase", "minwindef", "synchapi"] }