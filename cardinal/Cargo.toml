[package]
name = "cardinal"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = "0.11"
tokio = { version = "1", features = ["full"] }
md5 = "0.7"
sysinfo = "0.26"
winapi = { version = "^0.3", features = ["processthreadsapi", "memoryapi", "libloaderapi", "errhandlingapi", "synchapi", "winbase"] }

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"